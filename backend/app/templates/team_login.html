<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CyberSafe 2026 - Team Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/shared.css">
<style>
  main { max-width: 420px; margin: 60px auto 0; padding: 0 24px 80px; }
  .card { background: var(--paper); border-radius: 4px; box-shadow: 0 1px 2px rgba(27, 39, 51, 0.08); padding: 40px; text-align: center; }
  .card h1 { font-family: "Fraunces", Georgia, serif; font-size: 1.5rem; font-weight: 500; margin: 0 0 8px; }
  .card p { color: var(--ink-soft); font-size: 0.92rem; margin: 0 0 28px; }
  button.run { width: 100%; }
  .error-text { color: var(--sky-storm); font-size: 0.85rem; margin-top: 14px; display: none; }
  .error-text.show { display: block; }
  .enroll-link { display: block; margin-top: 22px; font-size: 0.85rem; color: var(--ink-faint); }
</style>
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <img src="/static/wcc-logo.png" alt="Wilkes Community College">
    <div class="wordmark">Cyber<span>Safe</span><small>a Carolina Cyber Network project</small></div>
    <img src="/static/ccn-logo.png" alt="Carolina Cyber Network">
  </div>
</header>

<main>
  <div class="card">
    <h1>Team sign in</h1>
    <p>Use the passkey on this device - no password, just Windows Hello, Touch ID, or your phone's screen lock.</p>
    <button class="run" id="login-btn">Sign in with passkey</button>
    <p class="error-text" id="error-text"></p>
    <a class="enroll-link" href="/team/enroll">Setting up a new device? Start here</a>
  </div>
</main>

<script src="/static/simplewebauthn-browser.min.js"></script>
<script>
function $(id) { return document.getElementById(id); }
const errorEl = $("error-text");

$("login-btn").addEventListener("click", async () => {
  errorEl.classList.remove("show");
  $("login-btn").disabled = true;
  try {
    const optsResp = await fetch("/api/team/login/options", { method: "POST" });
    if (!optsResp.ok) throw new Error("could not start login");
    const options = await optsResp.json();

    const authResponse = await SimpleWebAuthnBrowser.startAuthentication({ optionsJSON: options });

    const verifyResp = await fetch("/api/team/login/verify", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ response: authResponse }),
    });
    if (!verifyResp.ok) {
      const data = await verifyResp.json().catch(() => ({}));
      throw new Error(data.detail || "Login failed");
    }
    window.location.href = "/team/outreach";
  } catch (err) {
    errorEl.textContent = err.name === "NotAllowedError"
      ? "No passkey found on this device for this site - use \"Setting up a new device?\" below."
      : (err.message || "Something went wrong - try again.");
    errorEl.classList.add("show");
  } finally {
    $("login-btn").disabled = false;
  }
});
</script>

</body>
</html>
