<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CyberSafe 2026 - Outreach Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/shared.css">
<style>
  main { max-width: 640px; margin: 0 auto 60px; padding: 0 16px; }

  .top-bar {
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px; padding: 18px 0 14px;
  }
  .top-bar h1 { font-family: "Fraunces", Georgia, serif; font-size: 1.35rem; font-weight: 500; margin: 0; }
  .top-bar button.run { width: auto; padding: 9px 16px; font-size: 0.82rem; }

  .filters { display: flex; gap: 8px; margin-bottom: 12px; }
  .filters select, .filters input {
    font-family: "Public Sans", sans-serif; font-size: 0.88rem;
    padding: 10px 12px; border: 1px solid var(--rule); border-radius: 4px;
    background: var(--paper); color: var(--ink);
  }
  .filters select { flex: 0 0 auto; }
  .filters input[type="search"] { flex: 1; min-width: 0; }

  .assign-panel {
    background: var(--paper); border: 1px solid var(--rule); border-radius: 6px;
    margin-bottom: 14px; overflow: hidden;
  }
  .assign-panel summary {
    padding: 10px 14px; font-size: 0.85rem; font-weight: 600; cursor: pointer;
    color: var(--ink-soft);
  }
  .assign-panel .assign-body { padding: 0 14px 14px; display: flex; gap: 8px; }
  .assign-panel input { flex: 1; min-width: 0; }
  .assign-panel button.run { width: auto; padding: 10px 14px; font-size: 0.82rem; }
  .assign-hint { font-size: 0.76rem; color: var(--ink-faint); padding: 0 14px 10px; margin: 0; }

  .summary { color: var(--ink-soft); font-size: 0.82rem; margin: 0 0 14px; }

  .owner-group { margin-bottom: 12px; }
  .owner-group summary {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 14px 16px; background: var(--paper); border-radius: 8px; cursor: pointer;
    box-shadow: 0 1px 2px rgba(27,39,51,0.08); list-style: none;
  }
  .owner-group summary::-webkit-details-marker { display: none; }
  .owner-group[open] summary { border-radius: 8px 8px 0 0; box-shadow: none; border-bottom: 1px solid var(--rule); }
  .owner-name { font-family: "Fraunces", Georgia, serif; font-size: 1.05rem; font-weight: 500; }
  .owner-stats { font-size: 0.8rem; color: var(--ink-soft); flex-shrink: 0; }
  .owner-group .cards {
    display: flex; flex-direction: column; gap: 10px; padding: 12px;
    background: var(--mist); border-radius: 0 0 8px 8px;
  }

  .card { background: var(--paper); border-radius: 8px; padding: 16px; }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 4px; }
  .card-name { font-family: "Fraunces", Georgia, serif; font-size: 1.05rem; font-weight: 500; }
  .card-meta { color: var(--ink-soft); font-size: 0.82rem; margin-bottom: 12px; }
  .badge {
    display: inline-block; font-size: 0.72rem; font-weight: 600; padding: 2px 8px;
    border-radius: 999px; background: var(--mist); color: var(--ink-soft); white-space: nowrap;
  }
  .badge.check-address { background: var(--sky-hazy-soft); color: #8a4f10; }

  .call-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 13px; margin-bottom: 12px; border-radius: 6px;
    background: var(--sky-clear-soft); color: var(--sky-clear); font-weight: 700;
    font-size: 1rem; text-decoration: none; border: none;
  }
  .no-phone { color: var(--ink-faint); font-size: 0.85rem; margin-bottom: 12px; font-style: italic; }

  .row2 { display: flex; gap: 8px; margin-bottom: 10px; }
  .row2 > * { flex: 1; min-width: 0; }
  select.status-select, input.owner {
    font-family: "Public Sans", sans-serif; font-size: 0.85rem; padding: 8px 10px;
    border: 1px solid var(--rule); border-radius: 4px; background: var(--mist); width: 100%;
  }
  select.status-select:disabled { opacity: 0.7; }

  .steps { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
  .steps .label { font-size: 0.78rem; color: var(--ink-faint); margin-right: 2px; }
  .step-btn {
    font-size: 0.82rem; font-weight: 600; width: 30px; height: 30px; border-radius: 999px;
    border: 1px solid var(--rule); background: var(--mist); cursor: pointer;
  }
  .step-btn.done { background: var(--sky-clear-soft); border-color: var(--sky-clear); color: var(--sky-clear); }

  textarea.notes {
    width: 100%; min-height: 34px; font-family: "Public Sans", sans-serif; font-size: 0.85rem;
    padding: 8px 10px; border: 1px solid var(--rule); border-radius: 4px; background: var(--paper);
    resize: vertical;
  }
</style>
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <img src="/static/wcc-logo.png" alt="Wilkes Community College">
    <div class="wordmark">Cyber<span>Safe</span><small>a Carolina Cyber Network project</small></div>
    <img src="/static/ccn-logo.png" alt="Carolina Cyber Network">
  </div>
</header>

<main>
  <div class="top-bar">
    <h1>Who to call</h1>
    <button class="run" id="logout-btn">Log out</button>
  </div>

  <details class="assign-panel">
    <summary>Divide the list among the team</summary>
    <p class="assign-hint">Splits everyone below into even, closest-first chunks - one per name, in the order you type them. Overwrites any existing "whose lead" assignment.</p>
    <div class="assign-body">
      <input type="text" id="assign-names" placeholder="Cody, Zack, Andrew, ...">
      <button class="run" id="assign-btn">Divide it up</button>
    </div>
  </details>

  <div class="filters">
    <select id="filter-status">
      <option value="">Any status</option>
      <option value="draft">Not yet contacted</option>
      <option value="pending_signature">In conversation</option>
      <option value="authorized">Authorized</option>
    </select>
    <input type="search" id="filter-search" placeholder="Search name or city...">
  </div>

  <p class="summary" id="summary">Loading...</p>

  <div id="groups"></div>
</main>

<script>
function $(id) { return document.getElementById(id); }
let allTargets = [];

async function loadTargets() {
  const resp = await fetch("/api/team/outreach");
  if (resp.status === 401) { window.location.href = "/team/login"; return; }
  const data = await resp.json();
  allTargets = data.targets;
  render();
}

function matchesFilters(t) {
  const status = $("filter-status").value;
  const search = $("filter-search").value.trim().toLowerCase();
  if (status && t.status !== status) return false;
  if (search && !(t.name.toLowerCase().includes(search) || (t.city || "").toLowerCase().includes(search))) return false;
  return true;
}

function el(tag, props = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "text") node.textContent = v;
    else node.setAttribute(k, v);
  }
  for (const child of children) node.appendChild(child);
  return node;
}

async function patchTarget(businessId, payload) {
  await fetch(`/api/team/outreach/${businessId}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  });
}

function buildCard(t) {
  const card = el("div", { class: "card" });

  const top = el("div", { class: "card-top" });
  top.appendChild(el("div", { class: "card-name", text: t.name }));
  if (t.miles_from_event != null) {
    top.appendChild(el("span", { class: "badge", text: `${t.miles_from_event} mi` }));
  } else {
    top.appendChild(el("span", { class: "badge check-address", text: "Check address" }));
  }
  card.appendChild(top);

  const metaParts = [t.type, t.city].filter(Boolean).join(" · ");
  card.appendChild(el("div", { class: "card-meta", text: metaParts }));

  if (t.phone) {
    card.appendChild(el("a", { class: "call-btn", href: `tel:${t.phone}`, text: `Call ${t.phone}` }));
  } else {
    card.appendChild(el("div", { class: "no-phone", text: "No phone on file - in-person visit only" }));
  }

  const row2 = el("div", { class: "row2" });

  const statusSelect = el("select", { class: "status-select" });
  const statusOptions = [["draft", "Not yet contacted"], ["pending_signature", "In conversation"]];
  if (t.status === "authorized") statusOptions.push(["authorized", "Authorized"]);
  for (const [val, label] of statusOptions) {
    const opt = el("option", { value: val, text: label });
    if (val === t.status) opt.selected = true;
    statusSelect.appendChild(opt);
  }
  if (t.status === "authorized") statusSelect.disabled = true;
  statusSelect.addEventListener("change", () => patchTarget(t.business_id, { status: statusSelect.value }));
  row2.appendChild(statusSelect);

  const ownerInput = el("input", { class: "owner", value: t.outreach_owner || "", placeholder: "Whose lead?" });
  ownerInput.addEventListener("change", () => { patchTarget(t.business_id, { outreach_owner: ownerInput.value }); loadTargets(); });
  row2.appendChild(ownerInput);

  card.appendChild(row2);

  const steps = el("div", { class: "steps" });
  steps.appendChild(el("span", { class: "label", text: "Sequence:" }));
  [["step1", t.step1_sent_at], ["step2", t.step2_sent_at], ["step3", t.step3_sent_at]].forEach(([step, sentAt], i) => {
    const btn = el("button", { class: `step-btn${sentAt ? " done" : ""}`, text: `${i + 1}` });
    btn.title = sentAt ? `Sent ${sentAt}` : `Mark step ${i + 1} sent`;
    btn.addEventListener("click", async () => {
      await patchTarget(t.business_id, { [`mark_${step}_sent`]: true });
      loadTargets();
    });
    steps.appendChild(btn);
  });
  card.appendChild(steps);

  const notesArea = el("textarea", { class: "notes", placeholder: "Notes..." });
  notesArea.value = t.outreach_notes || "";
  notesArea.addEventListener("change", () => patchTarget(t.business_id, { outreach_notes: notesArea.value }));
  card.appendChild(notesArea);

  return card;
}

function render() {
  const filtered = allTargets.filter(matchesFilters);
  const groupCount = new Set(filtered.map((t) => t.outreach_owner || "Unassigned")).size;
  $("summary").textContent = `${filtered.length} of ${allTargets.length} targets shown, across ${groupCount} ${groupCount === 1 ? "group" : "groups"}`;

  const groups = new Map();
  for (const t of filtered) {
    const owner = t.outreach_owner || "Unassigned";
    if (!groups.has(owner)) groups.set(owner, []);
    groups.get(owner).push(t);
  }
  // Unassigned last - it's the leftover bucket, not anyone's actual queue.
  const ownerNames = [...groups.keys()].sort((a, b) => (a === "Unassigned") - (b === "Unassigned"));

  const container = $("groups");
  const previouslyOpen = new Set(
    [...container.querySelectorAll("details.owner-group[open]")].map((d) => d.dataset.owner)
  );
  container.textContent = "";

  for (const owner of ownerNames) {
    const targets = groups.get(owner);
    const notContacted = targets.filter((t) => t.status === "draft").length;
    const inConversation = targets.filter((t) => t.status === "pending_signature").length;

    const details = el("details", { class: "owner-group" });
    details.dataset.owner = owner;
    if (previouslyOpen.has(owner) || (previouslyOpen.size === 0 && ownerNames.length === 1)) {
      details.open = true;
    }

    const summary = el("summary");
    summary.appendChild(el("span", { class: "owner-name", text: owner }));
    summary.appendChild(el("span", {
      class: "owner-stats",
      text: `${targets.length} · ${notContacted} to contact · ${inConversation} in conversation`,
    }));
    details.appendChild(summary);

    const cardsWrap = el("div", { class: "cards" });
    for (const t of targets) cardsWrap.appendChild(buildCard(t));
    details.appendChild(cardsWrap);

    container.appendChild(details);
  }
}

$("filter-status").addEventListener("change", render);
$("filter-search").addEventListener("input", render);

$("assign-btn").addEventListener("click", async () => {
  const names = $("assign-names").value.split(",").map((n) => n.trim()).filter(Boolean);
  if (names.length < 2) {
    alert("Enter at least 2 names, separated by commas.");
    return;
  }
  $("assign-btn").disabled = true;
  try {
    const resp = await fetch("/api/team/outreach/auto-assign", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ names }),
    });
    if (!resp.ok) throw new Error((await resp.json()).detail || "Could not assign");
    await loadTargets();
  } catch (err) {
    alert(err.message || "Something went wrong.");
  } finally {
    $("assign-btn").disabled = false;
  }
});

$("logout-btn").addEventListener("click", async () => {
  await fetch("/api/team/logout", { method: "POST" });
  window.location.href = "/team/login";
});

loadTargets();
</script>

</body>
</html>
